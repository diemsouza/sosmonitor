name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write  # PyPI Trusted Publishing (OIDC), no token stored

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run tests
        run: python3 -m unittest discover tests

      - name: Read version from sosmonitor.py
        id: ver
        run: |
          VERSION=$(sed -nE 's/^VERSION = "([^"]+)".*/\1/p' sosmonitor.py)
          if [ -z "$VERSION" ]; then
            echo "VERSION not found in sosmonitor.py" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tagcheck
        run: |
          if git rev-parse "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.ver.outputs.tag }} already exists, nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          awk -v v="${{ steps.ver.outputs.version }}" '
            index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "No CHANGELOG.md entry for ${{ steps.ver.outputs.version }}" >&2
            exit 1
          fi

      - name: Create Git tag
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: notes.md
          files: sosmonitor.py

      # PyPI never accepts the same version twice. Not gated on the tag check,
      # so a failed publish is retried on the next push of the same version.
      - name: Build sdist and wheel
        run: |
          python3 -m pip install --upgrade build
          python3 -m build

      - name: Check if this version is already on PyPI
        id: pypi
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/sosmonitor/${{ steps.ver.outputs.version }}/json")
          if [ "$code" = "200" ]; then
            echo "sosmonitor ${{ steps.ver.outputs.version }} is already on PyPI, skipping publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.pypi.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
